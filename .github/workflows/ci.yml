name: CI

on:
  push:
    branches-ignore: [main]   # spec: tests/shipyard-workflow-coupling-test.sh (only one workflow may run the suite on main)
  pull_request:
    branches: [main]          # the `test` job here is main's required status check

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26   # the CMake modules gate on Apple clang; Linux cannot exercise them
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # spec: tests/shipyard-workflow-coupling-test.sh (shipyard-version.sh refuses a shallow clone)

      # spec: scripts/sdk-pins.sh -- keyed on the pins, so a pin change refetches; the arm64 SDK is ~600 MB.
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/mavericks-sdk
          key: mavericks-sdk-${{ hashFiles('scripts/sdk-pins.sh', 'scripts/fetch_sdk.sh') }}

      # spec: scripts/install-macho-readers.sh -- the compat guard reads Mach-O with LLVM's readers and
      #       never Apple's, and a macOS runner has only Apple's; this must run before the first build.
      - name: LLVM's Mach-O readers
        run: sh scripts/install-macho-readers.sh

      # spec: scripts/lib/macho-tools.sh -- records what the runner's Xcode provides and whether brew was needed.
      - name: What the Mach-O readers resolved to
        run: |
          . scripts/lib/macho-tools.sh
          for v in OTOOL LIPO NM STRINGS; do
            mach_tool "$v" || continue
            eval "p=\$$v"
            echo "$v=$p"; "$p" --version 2>&1 | head -n 1
          done
          for t in llvm-otool llvm-lipo llvm-nm llvm-strings; do echo "xcrun -f $t: $(xcrun -f $t 2>&1)"; done
          command -v brew >/dev/null 2>&1 && { brew list llvm >/dev/null 2>&1 && echo "brew llvm: present" || echo "brew llvm: absent"; } || echo "no brew"

      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/mavergreen-clang22
          key: mavergreen-clang22-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('components/clang22/version') }}

      - name: Install mavericks-shipyard (self, source-build) -- and bats, so the *.bats suites below can run
        uses: ./.github/actions/install
        with:
          source: build

      - name: Record the pre-build tree
        run: sh scripts/assert-tree-clean.sh --record

      - name: ctest (parameterized suites)
        run: |
          shipyard-cmake -S . -B "$RUNNER_TEMP/build"
          shipyard-ctest --test-dir "$RUNNER_TEMP/build" --output-on-failure

      - name: Standalone test suites
        run: sh scripts/run-repo-tests.sh

      - name: Our own conventions gate
        run: sh scripts/shipyard-check

      - name: The build must not have written into the source tree
        run: sh scripts/assert-tree-clean.sh

  linux:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/linux-host.yml
    secrets:
      MAVERICKS_VM_KEY: ${{ secrets.MAVERICKS_VM_KEY }}

  # spec: tests/on-target-job-test.sh -- the flag-day P1 ruling R5: this job runs every check on Mac OS X
  #       10.9. The guest has no python3 of its own, so it installs the python-315 release python-315.pin
  #       names, which Renovate bumps.
  on-target:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # spec: tests/shipyard-workflow-coupling-test.sh (shipyard-version.sh refuses a shallow clone)
          persist-credentials: false
      - name: The pinned python-315 release, fetched on the runner and verified against its SHA256SUMS
        run: |
          set -eu
          v="$(sed -n 's/^PYTHON_315_VERSION=//p' python-315.pin)"
          [ -n "$v" ] || { echo "::error::python-315.pin names no PYTHON_315_VERSION"; exit 1; }
          gh release download "$v" -R Mavergreen/python-315 --pattern '*.pkg' --pattern SHA256SUMS --dir python-315-pkg
          cd python-315-pkg
          set -- *.pkg
          [ "$#" -eq 1 ] || { echo "::error::python-315 $v has $# pkgs, not one: $*"; exit 1; }
          awk -v f="$1" '$2 == f' SHA256SUMS | sha256sum -c --strict -
      - name: Fixtures on Mac OS X 10.9
        uses: Mavergreen/mavericks-vm@v1
        with:
          image-key: ${{ secrets.MAVERICKS_VM_KEY }}
          copyback: false
          debug-on-error: true
          run: |
            set -eu
            sudo -n installer -pkg python-315-pkg/*.pkg -target /
            SHIPYARD_CHECK_DIR="$PWD/scripts" sh -c '. "$SHIPYARD_CHECK_DIR/lib/py.sh"; p="$(chk_python3)"; echo "python3: $p"; "$p" --version'
            sh tests/check-fixtures-run.sh --jobs 2
            while IFS= read -r t; do
              [ -n "$t" ] || continue
              echo "== $t"
              sh "$t"
            done < tests/on-target-tests

  # spec: R-P1-17 -- this job REHEARSES release.yml's whole packaging path. release.yml runs only on a
  #       push to main, so the packaging and install-smoke steps below would otherwise first execute
  #       during a push that is already publishing.
  package:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # spec: tests/shipyard-workflow-coupling-test.sh (shipyard-version.sh refuses a shallow clone)

      # spec: scripts/sdk-pins.sh -- keyed on the pins, so a pin change refetches; the arm64 SDK is ~600 MB.
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/mavericks-sdk
          key: mavericks-sdk-${{ hashFiles('scripts/sdk-pins.sh', 'scripts/fetch_sdk.sh') }}

      # spec: scripts/install-macho-readers.sh -- the compat guard reads Mach-O with LLVM's readers and
      #       never Apple's, and a macOS runner has only Apple's; this must run before the first build.
      - name: LLVM's Mach-O readers
        run: sh scripts/install-macho-readers.sh

      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/mavergreen-clang22
          key: mavergreen-clang22-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('components/clang22/version') }}

      - name: Install mavericks-shipyard (self, source-build)
        uses: ./.github/actions/install
        with:
          source: build

      - name: Record the pre-build tree
        run: sh scripts/assert-tree-clean.sh --record

      # spec: .github/workflows/release.yml -- the same two-arch build and merge it does, stated in
      #       full on its copy of this step.
      - name: Build the universal updater
        run: |
          set -eu
          sh tests/lib/build-updater.sh --arch x86_64 --arch arm64 --out "$RUNNER_TEMP/shipyard-updater.app"
          # spec: R-P1-22 -- NOT re-signed; release.yml's copy of this step states it in full.
          exe="$RUNNER_TEMP/shipyard-updater.app/Contents/MacOS/shipyard-updater"
          archs="$(${LIPO:-lipo} -info "$exe" | sed -n 's/.*: //p')"
          case " $archs " in *" x86_64 "*) ;; *) echo "::error::the merged updater has no x86_64 slice: $archs"; exit 1;; esac
          case " $archs " in *" arm64 "*) ;; *) echo "::error::the merged updater has no arm64 slice: $archs"; exit 1;; esac
          echo "merged updater: $archs"

      - name: Package
        run: |
          set -eu
          v="$(sh scripts/shipyard-version.sh | sed -n 's/^FULL=//p')"
          echo "rehearsing the pkg for $v"
          mkdir -p "$RUNNER_TEMP/dist"
          shipyard-cmake -S . -B "$RUNNER_TEMP/payload-build"
          # spec: scripts/package-pkg.sh -- the install bakes its prefix into mavericks-presets.json, so
          #       it installs INTO the pkg's prefix, staged under DESTDIR; package-pkg.sh refuses presets
          #       naming any other toolchain file.
          DESTDIR="$RUNNER_TEMP/payload-stage" shipyard-cmake --install "$RUNNER_TEMP/payload-build" \
            --prefix /usr/local/mavergreen/shipyard
          sh scripts/package-pkg.sh \
            --shipyard-prefix "$RUNNER_TEMP/payload-stage/usr/local/mavergreen/shipyard" \
            --app "$RUNNER_TEMP/shipyard-updater.app" \
            --version "$v" \
            --out "$RUNNER_TEMP/dist/mavericks-shipyard-$v.pkg"
          sh scripts/assert_pkg_installs_in_place.sh "$RUNNER_TEMP/dist/mavericks-shipyard-$v.pkg"

      # spec: SKILL.md "SDK pinning" -- the release runs full conformance; the rehearsal has no appcast
      #       or notes, so it runs the family's SDK audit on the dist alone, before the release ever sees
      #       it. The audit fails an unreadable pkg; the grep proves it checked at least one Mach-O slice
      #       (an empty dist reports "no Mach-O shipped" and fails here). No pipe: the default run shell
      #       has no pipefail, so a `| tee` would hide the audit's own exit status.
      - name: SDK pinning (the rehearsed pkg)
        run: |
          set -eu
          sh scripts/audit-release-sdks.sh --dist "$RUNNER_TEMP/dist" . > "$RUNNER_TEMP/sdk-audit.txt" \
            || { cat "$RUNNER_TEMP/sdk-audit.txt"; exit 1; }
          cat "$RUNNER_TEMP/sdk-audit.txt"
          grep -q 'Mach-O slices)' "$RUNNER_TEMP/sdk-audit.txt"

      # spec: scripts/sign_and_appcast.sh -- the rehearsal holds no signing key, so it writes the feed
      #       the way that script does (gen_appcast.sh over the notes and the pkg's length) with a
      #       placeholder signature, and the feed and notes checks see a dist shaped like the release's.
      - name: Artifact checks (the rehearsed pkg, with an unsigned feed)
        env:
          SHIPYARD_CHECK_REPO: .
          MAVERICKS_ALLOW_ARCHS: x86_64 arm64
        run: |
          set -eu
          SHIPYARD_CHECK_VERSION="$(sh scripts/shipyard-version.sh | sed -n 's/^FULL=//p')"
          export SHIPYARD_CHECK_VERSION
          d="$RUNNER_TEMP/dist"
          sh scripts/release-notes.sh --tag "v$SHIPYARD_CHECK_VERSION" --version "$SHIPYARD_CHECK_VERSION" \
            --product Shipyard --min-os 10.9.5 --out "$d/RELEASE_NOTES.md"
          pkg="$d/mavericks-shipyard-$SHIPYARD_CHECK_VERSION.pkg"
          len="$(wc -c < "$pkg" | tr -d ' ')"
          sh scripts/gen_appcast.sh "Mavericks Shipyard" "$SHIPYARD_CHECK_VERSION" \
            "https://github.com/Mavergreen/shipyard/releases/download/v$SHIPYARD_CHECK_VERSION/mavericks-shipyard-$SHIPYARD_CHECK_VERSION.pkg" \
            10.9.5 "$d/RELEASE_NOTES.md" "sparkle:edSignature=\"rehearsal\" length=\"$len\"" > "$d/shipyard.xml"
          sh scripts/shipyard-check --dist "$d"

      - name: Install smoke (the rehearsed pkg)
        timeout-minutes: 10
        run: |
          set -eu
          bad=0
          sudo installer -pkg "$RUNNER_TEMP"/dist/mavericks-shipyard-*.pkg -target / || bad=1
          sh scripts/assert-installed-shipyard.sh --cmake-version "$(sed 's/-mavericks\..*//' components/cmake/version)" --root / || bad=1
          /usr/local/bin/mavergreen check || bad=1
          if [ "$bad" -ne 0 ]; then
            echo "---- /var/log/install.log, the pkg's scripts ----"
            sudo grep -E 'preinstall|postinstall|mavericks-shipyard|mavergreen' /var/log/install.log | tail -n 100 || true
          fi
          [ "$bad" -eq 0 ] || exit 1

      # spec: scripts/assert-installed-shipyard.sh -- retain the exact smoke-tested pkg for rehearsal on developer Macs.
      - name: Save the rehearsed package
        uses: actions/upload-artifact@v7
        with:
          name: shipyard-rehearsal-pkg
          path: ${{ runner.temp }}/dist/*.pkg
          if-no-files-found: error

      - name: The build must not have written into the source tree
        run: sh scripts/assert-tree-clean.sh

  # spec: scripts/push-tag-with-token.sh -- release.yml's major-tag job runs only on a push to main, so
  #       its first real execution would be the flag-day push; this runs the same script against a
  #       throwaway tag, with a checkout that keeps no credentials, on flag-day pushes only.
  tag-push-rehearsal:
    if: github.ref == 'refs/heads/flag-day'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REHEARSAL_TAG: rehearsal-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Push a throwaway tag and see it on the remote
        run: |
          set -eu
          sh scripts/push-tag-with-token.sh "$REHEARSAL_TAG" HEAD -m "rehearsal"
          want="$(git rev-parse HEAD)"
          got="$(git ls-remote --tags origin "refs/tags/$REHEARSAL_TAG^{}" | cut -f1)"
          [ "$got" = "$want" ] || { echo "::error::$REHEARSAL_TAG is at '$got' on the remote, not $want"; exit 1; }
          echo "rehearsal tag $REHEARSAL_TAG exists at $want"
      - name: Delete it
        if: always()
        run: |
          set -eu
          sh scripts/push-tag-with-token.sh --delete "$REHEARSAL_TAG"
          [ -z "$(git ls-remote --tags origin "refs/tags/$REHEARSAL_TAG")" ] \
            || { echo "::error::$REHEARSAL_TAG is still on the remote"; exit 1; }
          echo "rehearsal tag $REHEARSAL_TAG is gone"
