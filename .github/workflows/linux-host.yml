name: linux-host

# spec: claude-plugins/mavergreen/skills/mavergreen-conventions/SKILL.md check 22 -- the Linux half
#       of shipyard, proven by running it: every host-agnostic suite, on Linux, with a skip counted as
#       a failure. Reusable so ci.yml (branches, PRs) and release.yml (main, before publish) run the
#       one definition; neither runs on the other's events.

on:
  workflow_call:
    secrets:
      MAVERICKS_VM_KEY:
        required: false

jobs:
  strict-host:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # spec: tests/shipyard-workflow-coupling-test.sh (shipyard-version.sh refuses a shallow clone)

      # spec: .github/actions/install/action.yml R-P1-18 -- the consumer's Linux path, exercised with
      #       this checkout: it installs bats and exports SHIPYARD_SCRIPTS and MavericksShipyard_DIR.
      - name: Install mavericks-shipyard (the Linux path)
        uses: ./.github/actions/install

      # spec: scripts/lib/macho-tools.sh, scripts/lib/pkg-read.sh -- the artifact checks read pkgs with
      #       bsdtar and Mach-O with LLVM's readers on every host, so the suites that run them run here
      #       for real: under --strict-host a skip is a failure. Ubuntu keeps LLVM's unsuffixed tools in
      #       /usr/lib/llvm-N/bin, which is not on PATH.
      - name: Install the artifact tools (bsdtar, LLVM's readers)
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools llvm
          ls -d /usr/lib/llvm-*/bin | sort -V | tail -n 1 >> "$GITHUB_PATH"

      - name: Record the pre-build tree
        run: sh scripts/assert-tree-clean.sh --record

      - name: Host-agnostic suites, strictly
        env:
          UPDATER_TEST_OUT: ${{ runner.temp }}/linux-updater
        run: sh scripts/run-repo-tests.sh --strict-host

      # spec: tests/check-fixtures-run.sh -- strictly: no fixture may skip on Linux; then again with git
      #       hidden, which is how the 10.9 guest runs them, so every fixture not marked NEEDS git proves it needs none.
      - name: Every check's fixtures
        run: sh tests/check-fixtures-run.sh --strict
      - name: The same fixtures with git hidden
        run: sh tests/check-fixtures-run.sh --no-git
      - name: Save the Linux-built updater
        uses: actions/upload-artifact@v7
        with:
          name: shipyard-updater-linux
          path: ${{ runner.temp }}/linux-updater/shipyard-updater-linux.tar
          if-no-files-found: error

      - name: Our own conventions gate, where consumers run it
        run: sh scripts/shipyard-check

      - name: bash32-parse, which a host declaration excuses here
        run: sh scripts/shipyard-check --only bash32-parse

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Renovate's own validator accepts default.json
        run: |
          . scripts/renovate.pin
          npx --yes --package "renovate@$RENOVATE_VERSION" -- renovate-config-validator --strict default.json

      - name: The suites must not have written into the source tree
        run: sh scripts/assert-tree-clean.sh

  on-target-updater:
    needs: strict-host
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: shipyard-updater-linux
          path: linux-updater
      - name: Launch the Linux-built updater on Mac OS X 10.9, check only
        uses: Mavergreen/mavericks-vm@v1
        with:
          image-key: ${{ secrets.MAVERICKS_VM_KEY }}
          copyback: false
          run: |
            set -eu
            sw_vers
            sh tests/lib/launch-updater.sh linux-updater/shipyard-updater-linux.tar
