name: CI

on:
  push:
    branches-ignore: [main]   # spec: tests/shipyard-workflow-coupling-test.sh (only one workflow may run the suite on main)
  pull_request:
    branches: [main]          # the `test` job here is main's required status check

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26   # the CMake modules gate on Apple clang; Linux cannot exercise them
    timeout-minutes: 90     # source-build mode builds CMake twice on a cache miss
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # spec: tests/shipyard-workflow-coupling-test.sh (shipyard-version.sh refuses a shallow clone)

      - id: cm
        uses: ./.github/actions/shipyard-cmake
      - name: Install mavericks-shipyard (self, source-build) -- and bats, so the *.bats suites below can run
        uses: ./.github/actions/install
        with:
          source: build
          cmake-tree: ${{ steps.cm.outputs.tree }}

      - name: Record the pre-build tree
        run: sh scripts/assert-tree-clean.sh --record

      # spec: this job's own PyYAML, not .github/actions/install's -- consumers reach the
      #       workflow-parse gate through family-conventions.yml on ubuntu-latest, whose python3
      #       already has PyYAML, so provisioning it in the shared install action would run a needless
      #       pip install in every consumer's release job. setup-python, not the system python3, so
      #       pip is not PEP 668 externally-managed.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Provision PyYAML (the workflow-parse gate's only dependency)
        run: python3 -m pip install --quiet pyyaml && python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      - name: ctest (parameterized suites)
        run: |
          shipyard-cmake -S . -B "$RUNNER_TEMP/build"
          shipyard-ctest --test-dir "$RUNNER_TEMP/build" --output-on-failure

      - name: Standalone test suites
        run: sh scripts/run-repo-tests.sh

      - name: The build must not have written into the source tree
        run: sh scripts/assert-tree-clean.sh

  linux:
    uses: ./.github/workflows/linux-host.yml

  # spec: R-P1-17 -- this job builds (or restores) the universal shipyard-cmake and publishes it as a
  #       run artifact so it can be run on a real 10.9 box, the only proof the x86_64 slice works
  #       there; and it REHEARSES release.yml's whole packaging path. release.yml runs only on a push
  #       to main, so the packaging and install-smoke steps below would otherwise first execute during
  #       the flag-day push -- the one push that must not be a rehearsal.
  shipyard-cmake:
    runs-on: macos-26
    timeout-minutes: 90     # a cache miss builds CMake twice
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # spec: tests/shipyard-workflow-coupling-test.sh (shipyard-version.sh refuses a shallow clone)
      - id: cm
        uses: ./.github/actions/shipyard-cmake
      - name: Install mavericks-shipyard (self, source-build)
        uses: ./.github/actions/install
        with:
          source: build
          cmake-tree: ${{ steps.cm.outputs.tree }}

      - name: Record the pre-build tree
        run: sh scripts/assert-tree-clean.sh --record

      # spec: scripts/package-pkg.sh -- $SHIPYARD_CMAKE_TREE, never the prefix install@v1 assembled:
      #       that prefix has shipyard installed into it, and this artifact is the bare CMake tree a
      #       10.9 box can unpack and run.
      - name: Pack the tree
        run: tar -czf "$RUNNER_TEMP/shipyard-cmake-tree.tar.gz" -C "$SHIPYARD_CMAKE_TREE" .
      - uses: actions/upload-artifact@v7
        with:
          name: shipyard-cmake-tree
          path: ${{ runner.temp }}/shipyard-cmake-tree.tar.gz

      # spec: .github/workflows/release.yml -- the same two-arch build and merge it does, stated in
      #       full on its copy of this step.
      - name: Build the universal updater
        run: |
          set -eu
          for a in "x86_64 10.9" "arm64 11.0"; do
            set -- $a
            shipyard-cmake -S . -B "$RUNNER_TEMP/upd-$1" -DSHIPYARD_BUILD_UPDATER=ON \
              -DMAVERICKS_ALLOW_GENERIC_ICON=ON -DCMAKE_OBJC_COMPILER=/usr/bin/clang \
              -DCMAKE_OSX_ARCHITECTURES="$1" -DCMAKE_OSX_DEPLOYMENT_TARGET="$2"
            shipyard-cmake --build "$RUNNER_TEMP/upd-$1"
          done
          sh scripts/lipo-merge-tree.sh \
            --a "$RUNNER_TEMP/upd-x86_64/MavericksShipyardUpdater.app" \
            --b "$RUNNER_TEMP/upd-arm64/MavericksShipyardUpdater.app" \
            --out "$RUNNER_TEMP/MavericksShipyardUpdater.app" \
            --require-archs "x86_64 arm64"
          # spec: R-P1-22 -- NOT re-signed; release.yml's copy of this step states it in full.
          exe="$RUNNER_TEMP/MavericksShipyardUpdater.app/Contents/MacOS/MavericksShipyardUpdater"
          archs="$(lipo -info "$exe" | sed -n 's/.*: //p')"
          case " $archs " in *" x86_64 "*) ;; *) echo "::error::the merged updater has no x86_64 slice: $archs"; exit 1;; esac
          case " $archs " in *" arm64 "*) ;; *) echo "::error::the merged updater has no arm64 slice: $archs"; exit 1;; esac
          echo "merged updater: $archs"

      - name: Package
        run: |
          set -eu
          v="$(sh scripts/shipyard-version.sh | sed -n 's/^FULL=//p')"
          echo "rehearsing the pkg for $v"
          mkdir -p "$RUNNER_TEMP/dist"
          shipyard-cmake -S . -B "$RUNNER_TEMP/payload-build"
          shipyard-cmake --install "$RUNNER_TEMP/payload-build" --prefix "$RUNNER_TEMP/payload-prefix"
          sh scripts/package-pkg.sh \
            --cmake-tree "$SHIPYARD_CMAKE_TREE" \
            --shipyard-prefix "$RUNNER_TEMP/payload-prefix" \
            --app "$RUNNER_TEMP/MavericksShipyardUpdater.app" \
            --version "$v" \
            --out "$RUNNER_TEMP/dist/mavericks-shipyard-$v.pkg"
          sh scripts/assert_pkg_installs_in_place.sh "$RUNNER_TEMP/dist/mavericks-shipyard-$v.pkg"

      - name: Install smoke (the rehearsed pkg)
        timeout-minutes: 10
        run: |
          set -eu
          bad=0
          sudo installer -pkg "$RUNNER_TEMP"/dist/mavericks-shipyard-*.pkg -target / || bad=1
          want="$(sed -n 's/^CMAKE_VERSION=//p' cmake.pin)"
          sh scripts/assert-installed-shipyard.sh --cmake-version "$want" --root / || bad=1
          /usr/local/bin/mavergreen check || bad=1
          if [ "$bad" -ne 0 ]; then
            echo "---- /var/log/install.log, the pkg's scripts ----"
            sudo grep -E 'preinstall|postinstall|mavericks-shipyard|mavergreen' /var/log/install.log | tail -n 100 || true
          fi
          [ "$bad" -eq 0 ] || exit 1

      - name: The build must not have written into the source tree
        run: sh scripts/assert-tree-clean.sh
