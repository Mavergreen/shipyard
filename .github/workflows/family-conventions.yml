name: family-conventions

# spec: mavergreen-conventions SKILL.md, "Family conventions" -- "Wire it with the reusable workflow"

on:
  workflow_call:
    inputs:
      shipyard-ref:
        description: "shipyard ref to take the gate from. Default v1 (the moving major tag)."
        type: string
        required: false
        default: v1

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out shipyard (for the gate script)
        uses: actions/checkout@v7
        with:
          repository: Mavergreen/shipyard
          ref: ${{ inputs.shipyard-ref }}
          path: .shipyard

      - name: Family conventions gate
        run: sh .shipyard/scripts/check-family-conventions.sh
