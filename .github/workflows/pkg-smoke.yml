name: pkg-smoke

# spec: tests/pkg-smoke-workflow-test.sh -- a shipyard pkg built on Linux, installed on Mac OS X 10.9
#       after the cmake product its preinstall requires, then asserted there. The slices are read on
#       Linux before this runs, since 10.9's lipo cannot read arm64.

on:
  workflow_call:
    inputs:
      artifact:
        description: the name of an artifact holding exactly one mavericks-shipyard-*.pkg
        required: true
        type: string
      ref:
        description: the commit whose scripts and tests run in the guest
        required: true
        type: string
    secrets:
      MAVERICKS_VM_KEY:
        required: false

jobs:
  smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: shipyard-pkg
      - name: Exactly one shipyard pkg
        env:
          ARTIFACT: ${{ inputs.artifact }}
        run: |
          set -eu
          set -- shipyard-pkg/mavericks-shipyard-*.pkg
          [ -f "$1" ] || { echo "::error::$ARTIFACT holds no mavericks-shipyard-*.pkg"; exit 1; }
          [ "$#" -eq 1 ] || { echo "::error::$ARTIFACT holds $# shipyard pkgs, not one: $*"; exit 1; }
      - name: The pinned cmake release, fetched on the runner and verified against its SHA256SUMS
        run: |
          set -eu
          v="$(sed -n 1p components/cmake/version)"
          [ -n "$v" ] || { echo "::error::components/cmake/version names no cmake release"; exit 1; }
          gh release download "$v" -R Mavergreen/cmake --pattern '*.pkg' --pattern SHA256SUMS --dir cmake-pkg
          cd cmake-pkg
          set -- *.pkg
          [ -f "$1" ] || { echo "::error::cmake $v has no pkg"; exit 1; }
          [ "$#" -eq 1 ] || { echo "::error::cmake $v has $# pkgs, not one: $*"; exit 1; }
          awk -v f="$1" '$2 == f' SHA256SUMS | sha256sum -c --strict -
      - name: Install cmake, then shipyard, on Mac OS X 10.9
        uses: Mavergreen/mavericks-vm@v1
        with:
          image-key: ${{ secrets.MAVERICKS_VM_KEY }}
          copyback: false
          run: |
            set -eu
            sw_vers
            bad=0
            sudo -n installer -pkg cmake-pkg/*.pkg -target / || bad=1
            sudo -n installer -pkg shipyard-pkg/mavericks-shipyard-*.pkg -target / || bad=1
            sh scripts/assert-installed-shipyard.sh --no-slices --cmake-version "$(sed 's/-mavericks\..*//' components/cmake/version)" --root / || bad=1
            /usr/local/bin/mavergreen check || bad=1
            while IFS= read -r t; do
              [ -n "$t" ] || continue
              echo "== $t"
              sh "$t" || bad=1
            done < tests/on-target-tests
            if [ "$bad" -ne 0 ]; then
              echo "---- /var/log/install.log, the pkgs' scripts ----"
              sudo -n grep -E 'preinstall|postinstall|mavericks-shipyard|mavergreen' /var/log/install.log | tail -n 100 || true
            fi
            [ "$bad" -eq 0 ]
