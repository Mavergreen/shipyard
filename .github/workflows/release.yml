name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request'
                && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26   # the CMake modules gate on Apple clang; Linux cannot exercise them
    timeout-minutes: 90
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # shipyard-version.sh counts commits
          persist-credentials: false

      # spec: scripts/sdk-pins.sh -- keyed on the pins, so a pin change refetches; the arm64 SDK is ~600 MB.
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/mavericks-sdk
          key: mavericks-sdk-${{ hashFiles('scripts/sdk-pins.sh', 'scripts/fetch_sdk.sh') }}

      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/mavergreen-clang22
          key: mavergreen-clang22-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('components/clang22/version') }}

      # spec: R-P1-19 -- shipyard cannot install a RELEASED shipyard to test the one it is about to
      #       release, so it installs itself in source-build mode, beside the pinned cmake product.
      # spec: scripts/install-macho-readers.sh -- the compat guard reads Mach-O with LLVM's readers and
      #       never Apple's, and a macOS runner has only Apple's; this must run before the first build.
      - name: LLVM's Mach-O readers
        run: sh scripts/install-macho-readers.sh

      - name: Install mavericks-shipyard (self, source-build)
        uses: ./.github/actions/install
        with:
          source: build

      - name: Record the pre-build tree
        run: sh scripts/assert-tree-clean.sh --record

      - name: Resolve the version
        id: ver
        run: |
          set -eu
          out="$(sh scripts/shipyard-version.sh)"
          ver="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
          printf '%s\n' "$ver" > VERSION      # a build product; gitignored, read by CMakeLists
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "shipyard $ver"

      - name: ctest (parameterized suites)
        run: |
          shipyard-cmake -S . -B "$RUNNER_TEMP/build"
          shipyard-ctest --test-dir "$RUNNER_TEMP/build" --output-on-failure

      - name: Standalone test suites
        run: sh scripts/run-repo-tests.sh

      - name: Our own conventions gate
        run: sh scripts/shipyard-check

      # spec: scripts/lipo-merge-tree.sh -- a deployment floor is per-configure and arm64 has no
      #       10.9, so the updater is built once per arch and merged. Both builds embed Sparkle's fat
      #       framework, so the only Mach-O that may differ is the updater's own executable, and the
      #       merge runs with NO --allow-differ: updater/Info.plist.in fixes LSMinimumSystemVersion at
      #       the family's floor rather than deriving it per build, precisely so the two plists come
      #       out byte-identical and a divergence is refused rather than papered over.
      - name: Build the universal updater
        run: |
          set -eu
          sh tests/lib/build-updater.sh --arch x86_64 --arch arm64 --out "$RUNNER_TEMP/shipyard-updater.app"
          # spec: R-P1-22 -- NOT re-signed. Nothing in shipyard's build signs this app, so the merge
          #       breaks no bundle seal; `lipo -create` copies each slice byte for byte, so the ad-hoc
          #       signature ld puts on the arm64 slice -- which Apple Silicon requires to run it at
          #       all -- survives untouched, and Sparkle.framework is copied whole, keeping ITS
          #       signature, which `--deep --sign -` would have replaced. `codesign --verify --deep`
          #       of an app carrying a VERSIONED framework is ambiguous by design, which is how this
          #       was found.
          exe="$RUNNER_TEMP/shipyard-updater.app/Contents/MacOS/shipyard-updater"
          archs="$(${LIPO:-lipo} -info "$exe" | sed -n 's/.*: //p')"
          case " $archs " in *" x86_64 "*) ;; *) echo "::error::the merged updater has no x86_64 slice: $archs"; exit 1;; esac
          case " $archs " in *" arm64 "*) ;; *) echo "::error::the merged updater has no arm64 slice: $archs"; exit 1;; esac
          echo "merged updater: $archs"

      - name: Package
        run: |
          set -eu
          v='${{ steps.ver.outputs.version }}'
          mkdir -p dist
          shipyard-cmake -S . -B "$RUNNER_TEMP/payload-build"
          # spec: scripts/package-pkg.sh -- the install bakes its prefix into mavericks-presets.json, so
          #       it installs INTO the pkg's prefix, staged under DESTDIR; package-pkg.sh refuses presets
          #       naming any other toolchain file.
          DESTDIR="$RUNNER_TEMP/payload-stage" shipyard-cmake --install "$RUNNER_TEMP/payload-build" \
            --prefix /usr/local/mavergreen/shipyard
          sh scripts/package-pkg.sh \
            --shipyard-prefix "$RUNNER_TEMP/payload-stage/usr/local/mavergreen/shipyard" \
            --app "$RUNNER_TEMP/shipyard-updater.app" \
            --version "$v" \
            --out "dist/mavericks-shipyard-$v.pkg"
          sh scripts/assert_pkg_installs_in_place.sh "dist/mavericks-shipyard-$v.pkg"

      - name: Release notes
        run: |
          set -eu
          v='${{ steps.ver.outputs.version }}'
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" --tag "v$v" --version "$v" \
            --product Shipyard --min-os 10.9.5 --out dist/RELEASE_NOTES.md
          [ -s dist/RELEASE_NOTES.md ] || { echo "::error::release notes came back empty"; exit 1; }

      - name: Sign + appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          v='${{ steps.ver.outputs.version }}'
          sh scripts/sign_and_appcast.sh --product shipyard --feed-dir dist \
            --channel-title "Mavericks Shipyard" \
            --version "$v" \
            --pkg-url "https://github.com/Mavergreen/shipyard/releases/download/v$v/mavericks-shipyard-$v.pkg" \
            --notes-file dist/RELEASE_NOTES.md \
            --pkg "dist/mavericks-shipyard-$v.pkg"
          # spec: mavergreen-conventions SKILL.md, "A self-upstream repo gets a real baseline
          #       too, via --tag-glob" -- this is the worked example the rule book names.
          sh scripts/assert_appcast_upgradeable.sh --appcast dist/shipyard.xml --version "v$v" --tag-glob 'v*.*.*'

      - name: Artifact checks
        env:
          SHIPYARD_CHECK_VERSION: ${{ steps.ver.outputs.version }}
          SHIPYARD_CHECK_REPO: .
          MAVERICKS_ALLOW_ARCHS: x86_64 arm64
        run: |
          set -eu
          sh scripts/shipyard-check --dist dist
          ls -l dist

      # spec: R-P1-17 -- what must hold of the installed result is stated ONCE, in
      #       scripts/assert-installed-shipyard.sh, because this step runs only on a push to main:
      #       its first real execution would otherwise be the flag-day push, the one push that must
      #       not be a rehearsal. ci.yml builds the same pkg on every branch push, installs it and
      #       runs that same script, and tests/assert-installed-shipyard-test.sh drives the script
      #       against a fixture root. What is left here is what only this runner can do: install for
      #       real on the one Apple Silicon box that sees the pkg before a developer's, and show the
      #       installer's log when something fails.
      - name: Install smoke (the pkg, on Apple Silicon)
        timeout-minutes: 10
        run: |
          set -eu
          v='${{ steps.ver.outputs.version }}'
          bad=0
          sudo installer -pkg "dist/mavericks-shipyard-$v.pkg" -target / || bad=1
          sh scripts/assert-installed-shipyard.sh --cmake-version "$(sed 's/-mavericks\..*//' components/cmake/version)" --root / || bad=1
          /usr/local/bin/mavergreen check || bad=1
          if [ "$bad" -ne 0 ]; then
            echo "---- /var/log/install.log, the pkg's scripts ----"
            sudo grep -E 'preinstall|postinstall|mavericks-shipyard|mavergreen' /var/log/install.log | tail -n 100 || true
          fi
          [ "$bad" -eq 0 ] || exit 1

      - name: The build must not have written into the source tree
        run: sh scripts/assert-tree-clean.sh

      - uses: actions/upload-artifact@v7
        with:
          name: shipyard-dist
          path: dist

  scan:
    needs: build
    if: always()        # a build that fails after signing left logs too; scan them
    permissions:
      actions: read     # this run's job logs
      contents: read
    uses: ./.github/workflows/scan-for-key.yml
    with:
      artifact: shipyard-dist
      shipyard-ref: ${{ github.sha }}
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  # spec: .github/workflows/linux-host.yml -- a release whose host-agnostic half is broken on Linux
  #       breaks every consumer's ubuntu-latest job the moment @v1 moves, so it does not publish.
  linux:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/linux-host.yml
    secrets:
      MAVERICKS_VM_KEY: ${{ secrets.MAVERICKS_VM_KEY }}

  publish:
    needs: [build, linux, scan]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      version: v${{ needs.build.outputs.version }}
      artifact: shipyard-dist
      shipyard-ref: ${{ github.sha }}

  # spec: tests/shipyard-release-workflow-test.sh -- every consumer installs through source: release,
  #       which no earlier job runs, so @v1 moves only once the release just published installs that way.
  canary:
    needs: [build, publish]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.build.outputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install
        with:
          release-version: v${{ needs.build.outputs.version }}
      - name: The release installs as a consumer gets it
        run: |
          set -eu
          sh scripts/assert-installed-shipyard.sh --cmake-version "$(sed 's/-mavericks\..*//' components/cmake/version)" --root /
          /usr/local/bin/mavergreen check
          shipyard-cmake --version | head -1

  major-tag:
    needs: [build, publish, canary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Move the major tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          major="v${{ needs.build.outputs.version }}"; major="${major%%.*}"
          sh scripts/push-tag-with-token.sh "$major" HEAD -m "$major -> v${{ needs.build.outputs.version }}"
