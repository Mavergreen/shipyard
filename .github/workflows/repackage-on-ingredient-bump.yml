name: repackage-on-ingredient-bump

# spec: mavergreen-conventions SKILL.md, "Consuming a Mavergreen toolchain + auto-propagation"
#       -- "Auto-propagation via the shared reusable workflow (dispatch, NOT tag)"

on:
  workflow_call:
    inputs:
      dispatch-workflow:
        description: "The consumer release workflow to dispatch."
        type: string
        required: false
        default: "release.yml"

concurrency:
  group: release-on-bump
  cancel-in-progress: false

jobs:
  repackage:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Install shipyard (for scripts/repackage-decision.sh)
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - name: Dispatch a release if a build ingredient or the upstream moved
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          DISPATCH_WORKFLOW: ${{ inputs.dispatch-workflow }}
        run: |
          set -eu
          SCR="$SHIPYARD_SCRIPTS"
          [ -d "$SCR" ] || { echo "::error::SHIPYARD_SCRIPTS unset -- this workflow needs install@v1 first"; exit 1; }
          before="$BEFORE"; case "$before" in ''|0000000000000000000000000000000000000000) before="HEAD~1";; esac
          CHANGED="$(git diff --name-only "$before" HEAD)"; export CHANGED
          out="$(sh "$SCR/repackage-decision.sh")"
          echo "decision: $out"
          case "$out" in SKIP=*) exit 0;; esac
          echo "dispatching $DISPATCH_WORKFLOW on main; its release decision publishes only changed content"
          gh workflow run "$DISPATCH_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main
