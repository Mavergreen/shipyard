name: Install shipyard
description: >
  Provide shipyard and shipyard-cmake to a job. A consumer references this action at the ref it pins
  (@v1 or @vX.Y.Z -- that ref IS the version) and gets exactly the pkgs a developer installs: the cmake
  product at the version that ref pins, then shipyard. CI and dev boxes run the same bytes. On Linux it
  lays down the same /opt/mavergreen/shipyard from that ref, whose launchers run the host's cmake.
  Consumers configure with shipyard-cmake; on macOS MavergreenShipyardConfig.cmake refuses any other
  cmake. The optional
  `products` input also installs named family products (SHORT@TAG) and their requires, on macOS
  and Linux alike, each where its pkg installs it (/opt/mavergreen/SHORT, or /usr/local/mavergreen/SHORT
  for a pinned pre-flag-day release). Each SHORT's repo is .mavergreen/ingredients/SHORT/REPO in the
  consumer's checkout.

inputs:
  products:
    description: >
      Whitespace-separated SHORT@TAG family products to install after shipyard, each with what it
      requires (for example go127@1.27.4-mavergreen.1), on any runner; empty installs none.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # spec: tests/linux-prerequisites-test.sh -- every family Linux build needs the same tools, so
    #       this checks them all up front and installs the missing ones, or fails once naming them all.
    - if: runner.os == 'Linux'
      shell: bash
      run: sh "$GITHUB_ACTION_PATH/../../../scripts/linux-prerequisites.sh"

    - shell: bash
      run: |
        set -eu
        # platform: bats must be installed BEFORE configuring -- shipyard's CMakeLists registers its
        #           shell-helper tests only when bats is present at that first configure, so
        #           installing it afterwards leaves those tests unregistered for the whole run.
        #           Installed from the platform package manager (checksummed bottle/package), never
        #           curl|sh.
        if command -v bats >/dev/null 2>&1; then echo "bats: $(command -v bats)"
        elif command -v brew >/dev/null 2>&1; then brew install bats-core && echo "bats: installed via brew"
        elif command -v apt-get >/dev/null 2>&1 && { [ "$(id -u)" -eq 0 ] || sudo -n true >/dev/null 2>&1; }; then
          s=""; [ "$(id -u)" -eq 0 ] || s="sudo -n"
          $s apt-get update -qq && $s env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bats && echo "bats: installed via apt"
        else echo "::warning::no bats and no package manager to install it; *.bats tests will be skipped"; fi

    # spec: claude-plugins/mavergreen/skills/mavergreen-conventions/SKILL.md "Cannot-verify is a
    #       FAILURE, never a pass" -- check-family-conventions.sh needs PyYAML to parse workflows, and
    #       product repos run that gate from their own suites in their release jobs. GitHub's macOS
    #       runner python3 has none, so each repo had worked around it: two skipped the gate, two
    #       provisioned their own. It goes into the python3 already on PATH, never a replacement
    #       interpreter, since a consumer's build may depend on that one.
    - id: mav-pyyaml
      shell: bash
      run: |
        set -eu
        if python3 -c 'import yaml' >/dev/null 2>&1; then echo "PyYAML: already importable"
        else
          # platform: the runner's python3 is PEP 668 externally-managed; --user keeps the install out
          #           of its own site-packages, and --break-system-packages is what pip demands for that
          python3 -m pip install --quiet --user --break-system-packages pyyaml
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'
        fi

    # spec: claude-plugins/mavergreen/skills/mavergreen-conventions/SKILL.md "SDK pinning" -- every
    #       consumer build fetches a pinned SDK, so without a cache every job re-downloads it. The key
    #       hashes the sdk-pins.sh and fetch_sdk.sh this ref ships (hashFiles() cannot see the action's
    #       own checkout), so neither a moved pin nor a change to the fetch can restore a stale SDK.
    - id: mav-sdk-key
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -eu
        root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        echo "key=mavergreen-sdk-$(cat "$root/scripts/sdk-pins.sh" "$root/scripts/fetch_sdk.sh" | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - if: runner.os == 'macOS'
      uses: actions/cache@v6
      with:
        path: ~/Library/Caches/mavergreen/sdk
        key: ${{ steps.mav-sdk-key.outputs.key }}

    # spec: 2026-10-09 C4 -- shipyard's launchers run the cmake product beside shipyard, and shipyard's
    #       pkg refuses to install without it, so it goes in first, at the pin this ref
    #       carries.
    - if: runner.os == 'macOS'
      shell: bash
      run: |
        set -eu
        root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        v="$(. "$root/scripts/mavergreen-meta.sh" && MAVERGREEN_REPO_ROOT="$root" mg_value ingredients/cmake/VERSION)" || v=
        [ -n "$v" ] || { echo "::error::$root/.mavergreen/ingredients/cmake/VERSION names no cmake release"; exit 1; }
        d="$RUNNER_TEMP/cmake-pkg"; mkdir -p "$d"
        pkg="$(sh "$root/scripts/fetch-release-pkg.sh" cmake "$v" "cmake-$v.pkg" "$d")"
        sudo installer -pkg "$pkg" -target /
        . "$root/scripts/mavergreen-meta.sh" && . "$root/scripts/lib/name-rules.sh"
        "$(mavergreen_prefix cmake)/bin/cmake" --version | head -1

    # spec: scripts/install-macho-readers.sh -- the compat guard every shipyard-cmake build runs reads
    #       Mach-O with LLVM's readers and never Apple's; a macOS runner has only Apple's, so they are
    #       named in the job's environment here, ahead of the first build.
    - if: runner.os == 'macOS'
      shell: bash
      run: |
        set -eu
        root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        sh "$root/scripts/install-macho-readers.sh"

    - if: runner.os == 'macOS'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eu
        # platform: this action is checked out at github.action_path = <repo>/.github/actions/install;
        #           the repo root (with CMakeLists.txt) is three levels up.
        root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        ref='${{ github.action_ref }}'
        # platform: github.action_ref is EMPTY for a consumer repo calling this action, and on any
        #           re-run -- it broke all 14 consumers at once on 2026-09-16. $root is
        #           <runner>/_actions/Mavergreen/shipyard/<ref>, so its basename is the ref we
        #           were actually checked out at, which is the one source always present.
        ref="${ref:-$(basename "$root")}"
        ver="$(sh "$root/scripts/resolve-action-version.sh" "$ref")" \
          || { echo "::error::'$ref' names no shipyard release -- pin Mavergreen/shipyard/.github/actions/install@v1 (or an exact @vX.Y.Z)"; exit 1; }
        d="$RUNNER_TEMP/shipyard-pkg"; mkdir -p "$d"
        pkg="$(sh "$root/scripts/fetch-release-pkg.sh" shipyard "v$ver" "shipyard-$ver.pkg" "$d")"
        sudo installer -pkg "$pkg" -target /
        . "$root/scripts/mavergreen-meta.sh" && . "$root/scripts/lib/name-rules.sh"
        "$(mavergreen_prefix)/bin/mavergreen" check
        echo "$(mavergreen_prefix)/bin" >> "$GITHUB_PATH"
        "$(mavergreen_prefix)/bin/shipyard-cmake" --version | head -1
        scripts="$(mavergreen_prefix shipyard)/share/cmake/MavergreenShipyard/scripts"
        [ -d "$scripts" ] || { echo "::error::the shipyard pkg installed no scripts dir at $scripts"; exit 1; }
        echo "SHIPYARD_SCRIPTS=$scripts" >> "$GITHUB_ENV"
        echo "shipyard $ver installed; SHIPYARD_SCRIPTS=$scripts"

    # spec: claude-plugins/mavergreen/skills/mavergreen-conventions/SKILL.md, the `bash32-parse` row --
    #       bash 3.2 is the /bin/sh of 10.9 and macOS, and this macOS step is one every pkg-building
    #       product already runs, so no repo wires the check by hand.
    - name: shipyard-check --only bash32-parse
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -eu
        root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        if ! git -C "$GITHUB_WORKSPACE" rev-parse --git-dir >/dev/null 2>&1; then
          echo "::notice::bash32-parse: not run -- $GITHUB_WORKSPACE is not a git checkout yet; check the repo out before this action and it runs here"
          exit 0
        fi
        cd "$GITHUB_WORKSPACE"
        sh "$root/scripts/shipyard-check" --only bash32-parse

    # spec: tests/linux-shipyard-prefix-test.sh -- Linux gets the pkg's own prefix, staged from the
    #       action's checkout at the ref the consumer pinned by the staging the pkg uses, and its
    #       launchers on PATH through /opt/mavergreen/bin as on macOS, so a build step is the same
    #       `shipyard-cmake --preset cross` on both hosts.
    - if: runner.os != 'macOS'
      shell: bash
      run: |
        set -eu
        root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        # spec: tests/install-action-linux-version-test.sh -- GitHub's Linux runners leave TMPDIR
        #       unset, so the presets' $penv{TMPDIR}/mavergreen-build became /mavergreen-build.
        if [ -z "${TMPDIR:-}" ]; then
          TMPDIR="${RUNNER_TEMP:-}"; [ -n "$TMPDIR" ] || TMPDIR=/tmp
          export TMPDIR
          echo "TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
        fi
        [ -f "$root/scripts/run-repo-tests.sh" ] || {
          echo "::error::$root/scripts does not look like shipyard's scripts dir (no run-repo-tests.sh) -- the action's own checkout is not where this expected it"; exit 1; }
        [ -f "$root/MavergreenShipyardConfig.cmake" ] || {
          echo "::error::$root holds no MavergreenShipyardConfig.cmake -- there is no shipyard here to install"; exit 1; }
        ref='${{ github.action_ref }}'
        local=no
        if [ -z "$ref" ] && [ "$(cd -P "$root" && pwd)" = "$(cd -P "${GITHUB_WORKSPACE:-/nonexistent}" 2>/dev/null && pwd)" ]; then
          local=yes
        fi
        ref="${ref:-$(basename "$root")}"
        ver=""
        if [ "$local" = yes ]; then
          echo "shipyard's own checkout ($root) names no release, so SHIPYARD_VERSION is unset"
        elif ver="$(sh "$root/scripts/resolve-action-version.sh" "$ref")"; then
          echo "SHIPYARD_VERSION=$ver" >> "$GITHUB_ENV"
        else
          ver=""
          echo "::warning::'$ref' names no shipyard release, so SHIPYARD_VERSION is unset and packaging a .pkg here will fail -- pin install@v1 or an exact @vX.Y.Z"
        fi
        p="$(sh "$root/scripts/install-shipyard-prefix.sh" ${ver:+--version "$ver"})"
        sd="$p/share/cmake/MavergreenShipyard"
        {
          echo "SHIPYARD_SCRIPTS=$sd/scripts"
          echo "MavergreenShipyard_DIR=$sd"
        } >> "$GITHUB_ENV"
        echo "${p%/*}/bin" >> "$GITHUB_PATH"
        "${p%/*}/bin/shipyard-cmake" --version | head -1
        echo "shipyard ${ver:-from $root} installed at $p; SHIPYARD_SCRIPTS=$sd/scripts, MavergreenShipyard_DIR=$sd, and ${p%/*}/bin is on PATH"

    # spec: tests/install-action-products-test.sh -- named products install after shipyard; products reach
    #       the script through env
    - if: inputs.products != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PRODUCTS: ${{ inputs.products }}
      run: |
        set -eu
        root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        echo "MAVERGREEN_INSTALLED=$RUNNER_TEMP/mavergreen-installed.txt" >> "$GITHUB_ENV"
        set -f
        MAVERGREEN_REPO_ROOT="$GITHUB_WORKSPACE" MAVERGREEN_INSTALLED="$RUNNER_TEMP/mavergreen-installed.txt" sh "$root/scripts/install-products.sh" $PRODUCTS
