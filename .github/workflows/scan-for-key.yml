# usage: mavergreen-conventions SKILL.md, "Sparkle updater" names this the family's proof that
#        no log or released file carries the signing key, and points here for the snippet:
#        scan:
#          needs: [build]
#          if: always() && needs.build.outputs.publish == 'yes'
#          permissions: { actions: read, contents: read }   # actions: read = this run's job logs
#          uses: Mavergreen/shipyard/.github/workflows/scan-for-key.yml@v1
#          with: { artifact: <the artifact publish-release.yml publishes> }
#          secrets: { SPARKLE_PRIVATE_KEY: "${{ secrets.SPARKLE_PRIVATE_KEY }}" }
#        publish:
#          needs: [build, scan]

name: scan-for-key

on:
  workflow_call:
    inputs:
      artifact:
        description: "Artifact holding the files about to be released."
        type: string
        required: true
      shipyard-ref:
        description: "shipyard ref to take the scan scripts from."
        type: string
        required: false
        default: v1
    secrets:
      SPARKLE_PRIVATE_KEY:
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      actions: read     # this run's job logs
      contents: read
    steps:
      - name: Check out shipyard (for the scan scripts)
        uses: actions/checkout@v7
        with:
          repository: Mavergreen/shipyard
          ref: ${{ inputs.shipyard-ref }}
          path: .shipyard

      # platform: download-artifact matched by pattern, not name -- a name that matches nothing fails
      #           the step, but a pattern that matches nothing downloads nothing, so a build that
      #           failed before uploading its artifact still gets its LOGS scanned below.
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact }}
          merge-multiple: true
          path: dist

      - name: No release artifact means a failed build -- scan its logs anyway
        run: |
          [ -d dist ] || { mkdir dist; echo "::notice::no ${{ inputs.artifact }} artifact (the build did not finish): scanning the logs only"; }

      - name: Fetch this run's finished job logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .shipyard/scripts/fetch_run_logs.sh "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" logs

      # platform: the key lives only in this step's own environment, read by the scanner -- the shell
      #           never expands it, and the scanner prints WHERE it found a piece, never the piece.
      - name: Scan the logs and the release files for the signing key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -u
          set +e   # the step runs under bash -e; the scanner's exit status is the answer, not a crash
          python3 .shipyard/scripts/scan_for_key.py logs dist   # directories: every file, all the way down
          rc=$?
          set -e
          case $rc in
            0) ;;
            1) echo "::error::a piece of SPARKLE_PRIVATE_KEY is in this run's logs or release files (above: where, never what). Nothing will be published."
               echo "::error::Treat the key as public: rotate it, and delete this run's logs once it finishes -- gh api -X DELETE repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/logs"
               exit 1 ;;
            *) echo "::error::could not scan for the signing key -- refusing to call that a pass"; exit 1 ;;
          esac
          { printf 'scanned %s finished job log(s) and %s release file(s) of run %s; no piece of the signing key\n' \
              "$(find logs -type f | wc -l | tr -d ' ')" "$(find dist -type f | wc -l | tr -d ' ')" "$GITHUB_RUN_ID"; } > sparkle-key-scan.txt
          cat sparkle-key-scan.txt

      - uses: actions/upload-artifact@v7
        with:
          name: sparkle-key-scan
          path: sparkle-key-scan.txt
