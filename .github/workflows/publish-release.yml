name: publish-release

# spec: mavergreen-conventions SKILL.md, "Publishing a release"

on:
  workflow_call:
    inputs:
      version:
        description: "Release version; also the tag name."
        type: string
        required: true
      artifact:
        description: "Artifact holding the assets and the notes file."
        type: string
        required: true
      notes-file:
        description: "Notes file within the artifact; becomes the Release body."
        type: string
        required: false
        default: RELEASE_NOTES.md
      target-commitish:
        description: "Commit the tag is minted at. Defaults to the caller's SHA."
        type: string
        required: false
        default: ""
      assets:
        description: "required (the default): the artifact must hold assets. none: a release of the notes alone, for a product with nothing to attach, such as a GitHub Action consumed by its tag; any asset present is refused, and no SHA256SUMS is made."
        type: string
        required: false
        default: required
      checksums:
        description: "Generate SHA256SUMS over the assets."
        type: boolean
        required: false
        default: true
      short:
        description: "The product's short name: .mavergreen/products/<short>/noun and line, read at the release commit, name the Release and the notes heading."
        type: string
        required: true
      shipyard-ref:
        description: "shipyard ref to take release-assets.sh from."
        type: string
        required: false
        default: v1
      force-reason:
        description: "The caller's force_publish: when it is not blank, the release publishes with every product changed, and the reason goes into its notes."
        type: string
        required: false
        default: ""
      line:
        description: "The tag glob of the release line the content is compared on; empty means *-mavergreen.*."
        type: string
        required: false
        default: ""
    outputs:
      published:
        description: "true when a release was published, false when its content was identical to the line's latest."
        value: ${{ jobs.publish.outputs.published }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.skip.outputs.published || steps.done.outputs.published }}
    steps:
      - name: Check out shipyard (for release-assets.sh)
        uses: actions/checkout@v7
        with:
          repository: Mavergreen/shipyard
          ref: ${{ inputs.shipyard-ref }}
          path: .shipyard

      - name: Fetch the product's names at the release commit
        id: names
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.target-commitish || github.sha }}
          SHORT: ${{ inputs.short }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          root="$RUNNER_TEMP/names"
          sh .shipyard/scripts/fetch-name-inputs.sh "$REPO" "$SHA" "$SHORT" "$root"
          title="$(MAVERGREEN_REPO_ROOT="$root" sh -c '. "$1"; mavergreen_name release-title "$2" "$3"' sh .shipyard/scripts/mavergreen-meta.sh "$SHORT" "$VERSION")"
          { echo "root=$root"; echo "title=$title"; } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: dist

      - name: Decide whether what a user installs changed
        id: decide
        env:
          REPO: ${{ github.repository }}
          REASON: ${{ inputs.force-reason }}
          LINE: ${{ inputs.line }}
          ASSETS: ${{ inputs.assets }}
          ROOT: ${{ steps.names.outputs.root }}
        run: |
          set -eu
          d="$RUNNER_TEMP/decision"
          if [ "$ASSETS" = none ] && [ ! -f dist/CONTENT-MANIFEST.txt ]; then
            printf 'publish\n\nA notes-only release has no installed content to compare.\n' > "$d"
          else
            [ -f dist/CONTENT-MANIFEST.txt ] \
              || { echo "::error::the artifact has no CONTENT-MANIFEST.txt -- run content-manifest.sh into dist/ after conformance"; exit 1; }
            sh .shipyard/scripts/release-decision.sh --manifest dist/CONTENT-MANIFEST.txt --repo "$REPO" \
              --line "${LINE:-*-mavergreen.*}" --repo-root "$ROOT" --force-reason "$REASON" > "$d"
          fi
          cat "$d"
          sed '1,/^$/d' "$d" >> "$GITHUB_STEP_SUMMARY"
          echo "decision=$(head -n 1 "$d")" >> "$GITHUB_OUTPUT"

      - name: Nothing to publish -- the content is unchanged
        id: skip
        if: steps.decide.outputs.decision == 'skip'
        run: echo "published=false" >> "$GITHUB_OUTPUT"

      - name: Carry unchanged products forward
        if: steps.decide.outputs.decision == 'publish'
        env:
          REPO: ${{ github.repository }}
          NOTES: ${{ inputs.notes-file }}
        run: sh .shipyard/scripts/carry-forward.sh dist "$REPO" "$RUNNER_TEMP/decision" "$NOTES"

      - name: Add the decision's sections to the notes
        id: decision-notes
        if: steps.decide.outputs.decision == 'publish'
        env:
          NOTES: ${{ inputs.notes-file }}
        run: |
          set -eu
          sed '1,/^$/d' "$RUNNER_TEMP/decision" | awk '/^### / { on = 1 } on' > "$RUNNER_TEMP/sections"
          [ ! -s "$RUNNER_TEMP/sections" ] || { printf '\n'; cat "$RUNNER_TEMP/sections"; } >> "dist/$NOTES"

      # platform: download-artifact matched by pattern, not name -- a name that matches nothing fails
      #           the step (a red annotation on what may be a legitimately unsigned release); a
      #           pattern that matches nothing downloads nothing, and require_key_scan.sh below
      #           decides whether that absence is acceptable.
      - name: Look for the signing-key scan
        if: steps.decide.outputs.decision == 'publish'
        uses: actions/download-artifact@v8
        with:
          pattern: sparkle-key-scan
          merge-multiple: true
          path: .keyscan

      - name: A signed release must have been scanned for the signing key
        if: steps.decide.outputs.decision == 'publish'
        run: sh .shipyard/scripts/require_key_scan.sh dist .keyscan

      - name: Select assets, verify the notes, checksum
        id: assets
        if: steps.decide.outputs.decision == 'publish'
        env:
          NOTES: ${{ inputs.notes-file }}
          CHECKSUMS: ${{ inputs.checksums }}
          VERSION: ${{ inputs.version }}
          ASSETS: ${{ inputs.assets }}
          SHORT: ${{ inputs.short }}
          MAVERGREEN_REPO_ROOT: ${{ steps.names.outputs.root }}
        run: |
          set -eu
          case "$ASSETS" in
            required) only= ;;
            none) only=--notes-only ;;
            *) echo "::error::assets: want required or none (got '$ASSETS')"; exit 1 ;;
          esac
          files="$(sh .shipyard/scripts/release-assets.sh $only dist "$NOTES")"
          sh .shipyard/scripts/check-release-notes.sh "dist/$NOTES" "$VERSION" --short "$SHORT" --tag "$VERSION"
          if [ "$CHECKSUMS" = true ] && [ -n "$files" ]; then
            ( cd dist && printf '%s\n' "$files" | sed 's|^dist/||' | xargs shasum -a 256 > SHA256SUMS )
            ( cd dist && shasum -a 256 -c SHA256SUMS ) \
              || { echo "::error::SHA256SUMS does not verify against the files it names -- a truncated or partial write looks exactly like a valid file until someone downloads it, so this re-reads and verifies what was just written rather than trusting it unread"; exit 1; }
            want="$(printf '%s\n' "$files" | sed 's|^dist/||' | sort)"
            got="$(sed 's/^[0-9a-f]*  //' dist/SHA256SUMS | sort)"
            [ "$want" = "$got" ] \
              || { echo "::error::SHA256SUMS covers $got; the assets are $want -- it must cover exactly the assets attached, neither a missing nor an extra entry"; exit 1; }
            files="$files
          dist/SHA256SUMS"
          fi
          echo "=== assets ==="; printf '%s\n' "$files"
          echo "=== body ==="; cat "dist/$NOTES"
          { echo 'files<<EOF'; printf '%s\n' "$files"; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      - name: Refuse an already-taken tag
        if: steps.decide.outputs.decision == 'publish'
        env:
          VER: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          sh .shipyard/scripts/assert_tag_publishable.sh \
            "$VER" "https://github.com/$REPO" "$REF_TYPE" "$REF_NAME" "$SHA"

      - name: A first release needs a README a human has read
        if: steps.decide.outputs.decision == 'publish'
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.target-commitish || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          n="$(gh api "repos/$REPO/releases?per_page=1" --jq 'length' 2>/dev/null || echo FAILED)"
          case "$n" in
            0) : ;;   # never released -- the gate applies
            FAILED)
              echo "::error::could not read releases for $REPO -- refusing to publish without knowing whether this is its first release."
              exit 1
              ;;
            *)
              echo "$REPO has released before -- the first-release README gate does not apply"
              exit 0
              ;;
          esac
          url="https://raw.githubusercontent.com/$REPO/$SHA/README.md"
          . .shipyard/scripts/mavergreen_fetch.sh
          if shipyard_curl "$url" first-release-readme.md; then
            :
          else
            echo "::error::could not fetch $url -- refusing to publish a first release without seeing its README."
            exit 1
          fi
          sh .shipyard/scripts/check-readme-reviewed.sh first-release-readme.md

      - name: Publish
        id: publish1
        if: steps.decide.outputs.decision == 'publish'
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.names.outputs.title }}
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ inputs.target-commitish || github.sha }}
          body_path: dist/${{ inputs.notes-file }}
          files: ${{ steps.assets.outputs.files }}

      - name: Publish failed -- clear its draft before retrying
        if: steps.decide.outputs.decision == 'publish' && steps.publish1.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VER: ${{ inputs.version }}
        run: |
          echo "::warning::publishing $VER failed (attempt 1 of 3); retrying from a clean slate in 30s"
          sh .shipyard/scripts/delete-draft-release.sh "$REPO" "$VER"
          sleep 30

      - name: Publish (attempt 2)
        id: publish2
        if: steps.decide.outputs.decision == 'publish' && steps.publish1.outcome == 'failure'
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.names.outputs.title }}
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ inputs.target-commitish || github.sha }}
          body_path: dist/${{ inputs.notes-file }}
          files: ${{ steps.assets.outputs.files }}

      - name: Publish failed again -- clear its draft before the last attempt
        if: steps.decide.outputs.decision == 'publish' && steps.publish2.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VER: ${{ inputs.version }}
        run: |
          echo "::warning::publishing $VER failed (attempt 2 of 3); last attempt in 90s"
          sh .shipyard/scripts/delete-draft-release.sh "$REPO" "$VER"
          sleep 90

      - name: Publish (attempt 3)
        id: publish3
        if: steps.decide.outputs.decision == 'publish' && steps.publish2.outcome == 'failure'
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.names.outputs.title }}
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ inputs.target-commitish || github.sha }}
          body_path: dist/${{ inputs.notes-file }}
          files: ${{ steps.assets.outputs.files }}

      - name: Nothing was published -- remove the draft
        # spec: mavergreen-conventions SKILL.md, "A failed upload must not strand a draft" --
        #       keyed on the FIRST attempt's outcome, not the last, or an intermediate failure
        #       leaves this condition silently false and a draft stranded.
        if: failure() && steps.decide.outputs.decision == 'publish' && steps.publish1.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VER: ${{ inputs.version }}
        run: |
          sh .shipyard/scripts/delete-draft-release.sh "$REPO" "$VER"
          echo "::error::publishing $VER failed after retrying; its draft is deleted and no tag was minted, so nothing was published."
          echo "::error::Re-run this run's failed jobs to publish the same build. If the caller's main has moved since this run started (a workflow change makes the tag 403), re-dispatch instead."
          exit 1

      - name: Report the release published
        id: done
        if: steps.decide.outputs.decision == 'publish'
        run: echo "published=true" >> "$GITHUB_OUTPUT"
