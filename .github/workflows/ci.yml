name: CI

on:
  push:
    branches-ignore: [main]   # spec: tests/shipyard-workflow-coupling-test.sh (only one workflow may run the suite on main)
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    permissions:
      contents: read
    uses: ./.github/workflows/linux-host.yml

  # spec: R-P1-17 -- this job REHEARSES release.yml's whole packaging path. release.yml runs only on a
  #       push to main, so the packaging steps below would otherwise first execute during a push that
  #       is already publishing.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # spec: tests/shipyard-workflow-coupling-test.sh (shipyard-version.sh refuses a shallow clone)

      # spec: scripts/sdk-pins.sh -- keyed on the pins, so a pin change refetches; the arm64 SDK is ~600 MB.
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/mavergreen/sdk
          key: mavergreen-sdk-${{ hashFiles('scripts/sdk-pins.sh', 'scripts/fetch_sdk.sh') }}

      - uses: actions/cache@v6
        with:
          path: ~/.cache/mavergreen-clang22
          key: mavergreen-clang22-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mavergreen/ingredients/clang22/VERSION') }}

      - name: Install shipyard (the Linux path)
        uses: ./.github/actions/install

      # spec: scripts/artifact-facts.sh -- GNU binutils cannot read Mach-O, so the merge, the SDK audit
      #       and the slice checks read it with clang22's LLVM tools.
      - name: clang22's Mach-O tools
        run: |
          set -eu
          CL="$(sh scripts/fetch_clang22.sh .)"
          {
            echo "LIPO=$CL/bin/llvm-lipo"
            echo "OTOOL=$CL/bin/llvm-otool"
            echo "NM=$CL/bin/llvm-nm"
            echo "STRINGS=$CL/bin/llvm-strings"
          } >> "$GITHUB_ENV"

      - name: Record the pre-build tree
        run: sh scripts/assert-tree-clean.sh --record

      - name: Package
        run: |
          set -eu
          v="$(sh scripts/shipyard-version.sh | sed -n 's/^FULL=//p')"
          echo "rehearsing the pkg for $v"
          mkdir -p "$RUNNER_TEMP/dist"
          # spec: scripts/stage-shipyard-prefix.sh -- the one staging of the prefix, which install@v1 lays down
          #       on Linux too; the install bakes its prefix into mavergreen-presets.json, so it installs INTO
          #       the pkg's prefix, staged under DESTDIR, and package-pkg.sh refuses presets naming any other.
          . scripts/mavergreen-meta.sh && . scripts/lib/name-rules.sh
          sh scripts/stage-shipyard-prefix.sh --stage "$RUNNER_TEMP/payload-stage" --build "$RUNNER_TEMP/payload-build" \
            --version "$v" > /dev/null
          sh scripts/package-pkg.sh \
            --shipyard-prefix "$RUNNER_TEMP/payload-stage$(mavergreen_prefix shipyard)" \
            --version "$v" \
            --dist "$RUNNER_TEMP/dist"
          sh scripts/assert_pkg_installs_in_place.sh "$RUNNER_TEMP/dist/shipyard-$v.pkg"

      # spec: SKILL.md "SDK pinning" -- the release runs full conformance; the rehearsal has no appcast
      #       or notes, so it runs the family's SDK audit on the dist alone, before the release ever sees
      #       it. The audit fails an unreadable pkg; the grep proves the pkg ships no Mach-O, since it
      #       ships no updater. No pipe: the default run shell has no pipefail, so a `| tee` would hide
      #       the audit's own exit status.
      - name: SDK pinning (the rehearsed pkg)
        run: |
          set -eu
          sh scripts/audit-release-sdks.sh --dist "$RUNNER_TEMP/dist" . > "$RUNNER_TEMP/sdk-audit.txt" \
            || { cat "$RUNNER_TEMP/sdk-audit.txt"; exit 1; }
          cat "$RUNNER_TEMP/sdk-audit.txt"
          grep -q 'COMPLIANT (no Mach-O shipped)' "$RUNNER_TEMP/sdk-audit.txt"

      # spec: scripts/sign_and_appcast.sh -- the rehearsal holds no signing key, so it writes the feed
      #       the way that script does (gen_appcast.sh over the notes and the pkg's length) with a
      #       placeholder signature, and the feed and notes checks see a dist shaped like the release's.
      - name: Artifact checks (the rehearsed pkg, with an unsigned feed)
        env:
          SHIPYARD_CHECK_REPO: .
          MAVERGREEN_ALLOW_ARCHS: x86_64 arm64
        run: |
          set -eu
          SHIPYARD_CHECK_VERSION="$(sh scripts/shipyard-version.sh | sed -n 's/^FULL=//p')"
          export SHIPYARD_CHECK_VERSION
          d="$RUNNER_TEMP/dist"
          pkg="$d/shipyard-$SHIPYARD_CHECK_VERSION.pkg"
          sh scripts/release-notes.sh --tag "v$SHIPYARD_CHECK_VERSION" --version "$SHIPYARD_CHECK_VERSION" \
            --short shipyard --pkg "$pkg" --out "$d/RELEASE_NOTES.md"
          . scripts/mavergreen-meta.sh && . scripts/lib/name-rules.sh
          len="$(wc -c < "$pkg" | tr -d ' ')"
          sh scripts/gen_appcast.sh shipyard "$SHIPYARD_CHECK_VERSION" \
            "https://github.com/Mavergreen/shipyard/releases/download/v$SHIPYARD_CHECK_VERSION/shipyard-$SHIPYARD_CHECK_VERSION.pkg" \
            "$(mavergreen_floor shipyard)" "$d/RELEASE_NOTES.md" "sparkle:edSignature=\"rehearsal\" length=\"$len\"" > "$d/shipyard.xml"
          sh scripts/shipyard-check --dist "$d"

      # spec: scripts/package-pkg.sh -- its input, as a tar that keeps modes and links, so the pkg
      #       can be rebuilt from the same bytes on another host and compared.
      - name: Tar the packaging inputs
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/inputs"
          tar -cf "$RUNNER_TEMP/inputs/payload-stage.tar" -C "$RUNNER_TEMP" payload-stage
          sh scripts/shipyard-version.sh | sed -n 's/^FULL=//p' > "$RUNNER_TEMP/inputs/version"

      - name: Save the packaging inputs
        uses: actions/upload-artifact@v7
        with:
          name: shipyard-rehearsal-inputs
          path: ${{ runner.temp }}/inputs/
          if-no-files-found: error

      - name: The build must not have written into the source tree
        run: sh scripts/assert-tree-clean.sh

  # spec: scripts/push-tag-with-token.sh -- release.yml's major-tag job runs only on a push to main, so
  #       its first real execution would be the flag-day push; this runs the same script against a
  #       throwaway tag, with a checkout that keeps no credentials, on flag-day pushes only.
  tag-push-rehearsal:
    if: github.ref == 'refs/heads/flag-day'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REHEARSAL_TAG: rehearsal-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Push a throwaway tag and see it on the remote
        run: |
          set -eu
          sh scripts/push-tag-with-token.sh "$REHEARSAL_TAG" HEAD -m "rehearsal"
          want="$(git rev-parse HEAD)"
          got="$(git ls-remote --tags origin "refs/tags/$REHEARSAL_TAG^{}" | cut -f1)"
          [ "$got" = "$want" ] || { echo "::error::$REHEARSAL_TAG is at '$got' on the remote, not $want"; exit 1; }
          echo "rehearsal tag $REHEARSAL_TAG exists at $want"
      - name: Delete it
        if: always()
        run: |
          set -eu
          sh scripts/push-tag-with-token.sh --delete "$REHEARSAL_TAG"
          [ -z "$(git ls-remote --tags origin "refs/tags/$REHEARSAL_TAG")" ] \
            || { echo "::error::$REHEARSAL_TAG is still on the remote"; exit 1; }
          echo "rehearsal tag $REHEARSAL_TAG is gone"

  required:
    name: required (ci)
    if: always()
    needs: [linux, package, tag-push-rehearsal]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/required-gate
        with:
          needs: ${{ toJSON(needs) }}
