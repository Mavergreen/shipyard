name: linux-host

# spec: claude-plugins/mavergreen/skills/mavergreen-conventions/SKILL.md check 22 -- the Linux half
#       of shipyard, proven by running it: every host-agnostic suite, on Linux, with a skip counted as
#       a failure. Reusable so ci.yml (branches, PRs) and release.yml (main, before publish) run the
#       one definition; neither runs on the other's events.

on:
  workflow_call:

jobs:
  strict-host:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # spec: tests/shipyard-workflow-coupling-test.sh (shipyard-version.sh refuses a shallow clone)

      # spec: .github/actions/install/action.yml R-P1-18 -- the consumer's Linux path, exercised with
      #       this checkout: it installs bats and exports SHIPYARD_SCRIPTS and MavergreenShipyard_DIR.
      - name: Install shipyard (the Linux path)
        uses: ./.github/actions/install

      # spec: scripts/lib/macho-tools.sh, scripts/lib/pkg-tree.sh -- the artifact checks read pkgs with
      #       stevedore and Mach-O with LLVM's readers on every host, so the suites that run them run here
      #       for real: under --strict-host a skip is a failure. Ubuntu keeps LLVM's unsuffixed tools in
      #       /usr/lib/llvm-N/bin, which is not on PATH.
      - name: Install the artifact tools (LLVM's readers)
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm
          ls -d /usr/lib/llvm-*/bin | sort -V | tail -n 1 >> "$GITHUB_PATH"

      - name: Record the pre-build tree
        run: sh scripts/assert-tree-clean.sh --record

      - name: Host-agnostic suites, strictly
        run: sh scripts/run-repo-tests.sh --strict-host

      # spec: tests/check-fixtures-run.sh -- strictly: no fixture may skip on Linux; then again with git
      #       hidden, which is how a 10.9 box runs them, so every fixture not marked NEEDS git proves it needs none.
      - name: Every check's fixtures
        run: sh tests/check-fixtures-run.sh --strict
      - name: The same fixtures with git hidden
        run: sh tests/check-fixtures-run.sh --no-git

      - name: Our own conventions gate, where consumers run it
        run: sh scripts/shipyard-check

      - name: bash32-parse, which a host declaration excuses here
        run: sh scripts/shipyard-check --only bash32-parse

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Renovate's own validator accepts default.json
        run: |
          RENOVATE_VERSION="$(. scripts/mavergreen-meta.sh && mg_value ingredients/renovate/VERSION)"
          npx --yes --package "renovate@$RENOVATE_VERSION" -- renovate-config-validator --strict default.json

      - name: The suites must not have written into the source tree
        run: sh scripts/assert-tree-clean.sh
