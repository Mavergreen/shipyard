name: release

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 2'
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish whatever changed, giving this reason in the notes. shipyard publishes every rebuild anyway (its publish-unchanged deviation)."
        type: string
        required: false
        default: ""
      reproduce_tag:
        description: "Rebuild this release tag cold and compare it with what it published; publishes nothing."
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request'
                && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest   # spec: 2026-10-24 macOS runner exit -- building, packaging, signing and conformance are host-agnostic
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
      reproduce-tag: ${{ steps.target.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # shipyard-version.sh counts commits
          persist-credentials: false

      # spec: explain/reproduce-wired.md -- the schedule rebuilds the line's latest release and a
      #       reproduce_tag dispatch that tag, from the tag's own tree.
      - name: The release to reproduce, if any
        id: target
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ inputs.reproduce_tag }}
        run: |
          set -eu
          if [ -z "$TAG" ] && [ "$EVENT" = schedule ]; then
            TAG="$(sh scripts/previous-release-tag.sh --tag-glob 'v*.*.*')"
            [ -n "$TAG" ] || { echo "::error::no v*.*.* release to reproduce"; exit 1; }
          fi
          [ -n "$TAG" ] || exit 0
          git checkout -q "refs/tags/$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "reproducing $TAG, cold"

      # spec: scripts/sdk-pins.sh -- keyed on the pins, so a pin change refetches; the arm64 SDK is ~600 MB.
      - if: steps.target.outputs.tag == ''
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/mavergreen/sdk
          key: mavergreen-sdk-${{ hashFiles('scripts/sdk-pins.sh', 'scripts/fetch_sdk.sh') }}

      - if: steps.target.outputs.tag == ''
        uses: actions/cache@v6
        with:
          path: ~/.cache/mavergreen-clang22
          key: mavergreen-clang22-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mavergreen/ingredients/clang22/VERSION') }}

      # spec: R-P1-19 -- shipyard cannot install a RELEASED shipyard to test the one it is about to
      #       release. On Linux, install@v1 by local path lays down this checkout's prefix.
      - name: Install shipyard (the Linux path)
        uses: ./.github/actions/install

      # spec: scripts/artifact-facts.sh -- GNU binutils cannot read Mach-O, so the merge and
      #       conformance's slice and SDK checks read it with clang22's LLVM tools.
      - name: clang22's Mach-O tools
        run: |
          set -eu
          CL="$(sh scripts/fetch_clang22.sh .)"
          {
            echo "LIPO=$CL/bin/llvm-lipo"
            echo "OTOOL=$CL/bin/llvm-otool"
            echo "NM=$CL/bin/llvm-nm"
            echo "STRINGS=$CL/bin/llvm-strings"
          } >> "$GITHUB_ENV"

      - name: Record the pre-build tree
        run: sh scripts/assert-tree-clean.sh --record

      - name: Resolve the version
        id: ver
        run: |
          set -eu
          out="$(sh scripts/shipyard-version.sh)"
          ver="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
          printf '%s\n' "$ver" > VERSION      # a build product; gitignored, read by CMakeLists
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "shipyard $ver"

      - name: Package
        run: |
          set -eu
          v='${{ steps.ver.outputs.version }}'
          mkdir -p dist
          # spec: scripts/stage-shipyard-prefix.sh -- the one staging of the prefix, which install@v1 lays down
          #       on Linux too; the install bakes its prefix into mavergreen-presets.json, so it installs INTO
          #       the pkg's prefix, staged under DESTDIR, and package-pkg.sh refuses presets naming any other.
          . scripts/mavergreen-meta.sh && . scripts/lib/name-rules.sh
          sh scripts/stage-shipyard-prefix.sh --stage "$RUNNER_TEMP/payload-stage" --build "$RUNNER_TEMP/payload-build" \
            --version "$v" > /dev/null
          sh scripts/package-pkg.sh \
            --shipyard-prefix "$RUNNER_TEMP/payload-stage$(mavergreen_prefix shipyard)" \
            --version "$v" \
            --dist dist
          sh scripts/assert_pkg_installs_in_place.sh "dist/shipyard-$v.pkg"

      - name: Release notes
        run: |
          set -eu
          v='${{ steps.ver.outputs.version }}'
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" --tag "v$v" --version "$v" \
            --short shipyard --pkg "dist/shipyard-$v.pkg" --out dist/RELEASE_NOTES.md
          [ -s dist/RELEASE_NOTES.md ] || { echo "::error::release notes came back empty"; exit 1; }

      - name: Sign + appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          v='${{ steps.ver.outputs.version }}'
          sh scripts/sign_and_appcast.sh --product shipyard --feed-dir dist \
            --version "$v" \
            --pkg-url "https://github.com/Mavergreen/shipyard/releases/download/v$v/shipyard-$v.pkg" \
            --notes-file dist/RELEASE_NOTES.md \
            --pkg "dist/shipyard-$v.pkg"

      # spec: mavergreen-conventions SKILL.md, "A self-upstream repo gets a real baseline
      #       too, via --tag-glob" -- this is the worked example the rule book names. A reproduce
      #       run rebuilds a tag that newer tags outrank, and publishes nothing.
      - name: The feed must be an upgrade
        if: steps.target.outputs.tag == ''
        run: sh scripts/assert_appcast_upgradeable.sh --appcast dist/shipyard.xml --version "v${{ steps.ver.outputs.version }}" --tag-glob 'v*.*.*'

      - name: Artifact checks
        env:
          SHIPYARD_CHECK_VERSION: ${{ steps.ver.outputs.version }}
          SHIPYARD_CHECK_REPO: .
          MAVERGREEN_ALLOW_ARCHS: x86_64 arm64
        run: |
          set -eu
          sh scripts/shipyard-check --dist dist
          ls -l dist

      - name: Content and release manifests
        env:
          SHIPYARD_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          v='${{ steps.ver.outputs.version }}'
          sh scripts/content-manifest.sh dist "$v" . > dist/CONTENT-MANIFEST.txt
          sh scripts/release-manifest.sh dist "$v" . > dist/RELEASE-MANIFEST.txt

      - name: The build must not have written into the source tree
        run: sh scripts/assert-tree-clean.sh

      - uses: actions/upload-artifact@v7
        with:
          name: shipyard-dist
          path: dist

  scan:
    needs: build
    if: always()        # a build that fails after signing left logs too; scan them
    permissions:
      actions: read     # this run's job logs
      contents: read
    uses: ./.github/workflows/scan-for-key.yml
    with:
      artifact: shipyard-dist
      shipyard-ref: ${{ github.sha }}
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  # spec: .github/workflows/linux-host.yml -- a release whose host-agnostic half is broken on Linux
  #       breaks every consumer's ubuntu-latest job the moment @v1 moves, so it does not publish.
  linux:
    permissions:
      contents: read
    uses: ./.github/workflows/linux-host.yml

  # spec: explain/release-dispatch.md -- shipyard publishes on a push, by its publish-unchanged
  #       deviation, and never in a reproduce run.
  publish:
    needs: [build, linux, scan]
    if: github.event_name != 'schedule' && inputs.reproduce_tag == ''
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      version: v${{ needs.build.outputs.version }}
      artifact: shipyard-dist
      short: shipyard
      shipyard-ref: ${{ github.sha }}
      force-reason: ${{ inputs.force_publish }}
      line: 'v*.*.*'

  reproduce:
    needs: [build]
    if: github.event_name == 'schedule' || inputs.reproduce_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: shipyard-dist
          path: ${{ runner.temp }}/rebuilt
      - name: Compare the rebuild with the release
        env:
          TAG: ${{ needs.build.outputs.reproduce-tag }}
        run: |
          set -eu
          git worktree add -q "$RUNNER_TEMP/tagtree" "refs/tags/$TAG"
          SHIPYARD_VERSION="$(cd "$RUNNER_TEMP/tagtree" && sh scripts/shipyard-version.sh | sed -n 's/^FULL=//p')"; export SHIPYARD_VERSION
          sh scripts/reproduce.sh --dist "$RUNNER_TEMP/rebuilt" --repo "$GITHUB_REPOSITORY" --tag "$TAG" --repo-root "$RUNNER_TEMP/tagtree"

  major-tag:
    needs: [build, publish]
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Move the major tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          major="v${{ needs.build.outputs.version }}"; major="${major%%.*}"
          sh scripts/push-tag-with-token.sh "$major" HEAD -m "$major -> v${{ needs.build.outputs.version }}"
